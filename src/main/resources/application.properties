# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration (Environment Variable Driven with local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:upimesh;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Schema Control
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# Database Migrations (Flyway)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# H2 Console (for standalone dev mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Distributed Idempotency (Redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Mesh Protocol & Idempotency Parameters
upi.mesh.idempotency-ttl-seconds=${IDEMPOTENCY_TTL_SECONDS:86400}
upi.mesh.packet-max-age-seconds=${PACKET_MAX_AGE_SECONDS:86400}
upi.mesh.processing-lock-ttl-ms=${PROCESSING_LOCK_TTL_MS:30000}
upi.mesh.stuck-timeout-seconds=${STUCK_TIMEOUT_SECONDS:90}
upi.mesh.recovery-interval-ms=${RECOVERY_INTERVAL_MS:60000}

# Production Observability (Actuator & Micrometer)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.settlement_latency=true
management.metrics.distribution.percentiles.settlement_latency=0.5,0.95,0.99

# Logging Pattern with MDC structured fields
logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} [txId=%X{transactionId} pktId=%X{packetId} walletId=%X{walletId} bridgeId=%X{bridgeId} deviceId=%X{deviceId} state=%X{processingState} corrId=%X{correlationId}] - %msg%n
